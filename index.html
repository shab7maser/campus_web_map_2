<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>خريطتي على الويب – الحرم الجامعي، جامعة دمنهور</title>
<style>
:root{--bg:#f6f7f9;--fg:#1b1f24;--card:#fff;--bd:#d7dbe0;--mut:#5c6670;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171a;--fg:#eceff2;--card:#1f2428;--bd:#38404a;--mut:#9aa5b1}}
:root[data-theme="dark"]{--bg:#14171a;--fg:#eceff2;--card:#1f2428;--bd:#38404a;--mut:#9aa5b1}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:Tahoma,"Segoe UI",Arial,sans-serif;display:flex;flex-direction:column}
h1{font-size:18px;margin:0;padding:10px 14px;border-bottom:1px solid var(--bd);background:var(--card)}
#wrap{position:relative;flex:1;min-height:240px;overflow:hidden;touch-action:none;background:#222;cursor:grab}
#map{width:100%;height:100%;display:block}
.f{cursor:pointer;transition:fill-opacity .15s}
.poly{fill-opacity:.2;stroke-width:3;vector-effect:non-scaling-stroke}
.poly:hover{fill-opacity:.4}
.poly.sel{fill-opacity:.5;stroke:#fff;stroke-width:5}
.line{fill:none;stroke-opacity:.55;stroke-linecap:round;stroke-linejoin:round}
.line:hover,.line.sel{stroke-opacity:1}
.ring{fill:rgba(255,255,255,.01);stroke-width:3.5}
.under{fill:none;stroke:#fff;stroke-width:7}
.f.sel .ring{stroke-width:6}
.btns{position:absolute;inset-inline-start:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.btns button{width:38px;height:38px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--fg);font-size:20px;cursor:pointer}
#panel{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px;max-height:36vh;overflow:auto}
@media (max-width:640px){#panel{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px}
.card h2{font-size:15px;margin:0 0 8px}
.lg{display:flex;flex-wrap:wrap;gap:6px}
.lg label{display:flex;align-items:center;gap:6px;border:1px solid var(--bd);border-radius:16px;padding:4px 10px;font-size:13px;cursor:pointer}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}
#nm{font-weight:bold;font-size:16px}
#en{color:var(--mut);font-size:13px;direction:ltr;text-align:right}
#tp{display:inline-block;font-size:12px;padding:2px 8px;border-radius:10px;color:#fff;margin:6px 0}
#ds{font-size:14px;line-height:1.7;margin:0}
.note{font-size:12px;color:var(--mut);padding:0 12px 10px}
</style>
</head>

else if(d[0]=='line'){el=mk('polyline',{points:d[5].join(' '),stroke:c,'stroke-width':d[6],class:'f line','data-cat':d[1]},$('lines'));}
else{el=mk('g',{class:'f pt','data-cat':d[1],'data-x':d[5][0],'data-y':d[5][1]},$('pts'));
const sh=d[1]=='p'?['rect',{x:-15,y:-15,width:30,height:30}]:d[1]=='a'?['polygon',{points:'0,-20 18,14 -18,14'}]:['circle',{r:17}];
mk(sh[0],sh[1],el).setAttribute('class','under');const r=mk(sh[0],sh[1],el);r.setAttribute('class','ring');r.setAttribute('stroke',d[1]=='p'?'#ffd400':c);}
mk('title',{},el).textContent=d[2];
el.addEventListener('click',()=>pick(el,d));});
const lg=$('lg');for(const k in CATS){const l=document.createElement('label');
l.innerHTML='<input type="checkbox" checked><span class="sw" style="background:'+CATS[k][1]+'"></span>'+CATS[k][0];
l.firstChild.addEventListener('change',e=>document.querySelectorAll('[data-cat="'+k+'"]').forEach(x=>x.style.display=e.target.checked?'':'none'));lg.appendChild(l);}
const wrap=$('wrap'),view=$('view');let s=1,tx=0,ty=0,fs=1;
function apply(){view.setAttribute('transform','translate('+tx+' '+ty+') scale('+s+')');
document.querySelectorAll('.pt').forEach(e=>e.setAttribute('transform','translate('+e.dataset.x+' '+e.dataset.y+') scale('+(1/s)+')'));}
function fit(){const r=wrap.getBoundingClientRect();fs=Math.min(r.width/W0,r.height/H0);s=fs;tx=(r.width-W0*s)/2;ty=(r.height-H0*s)/2;apply();}
function zoom(cx,cy,k){const ns=Math.min(fs*10,Math.max(fs*.8,s*k));k=ns/s;tx=cx-(cx-tx)*k;ty=cy-(cy-ty)*k;s=ns;apply();}
const ctr=()=>{const r=wrap.getBoundingClientRect();return[r.width/2,r.height/2]};
$('zi').onclick=()=>zoom(...ctr(),1.4);$('zo').onclick=()=>zoom(...ctr(),1/1.4);$('zr').onclick=fit;
wrap.addEventListener('wheel',e=>{e.preventDefault();const r=wrap.getBoundingClientRect();zoom(e.clientX-r.left,e.clientY-r.top,e.deltaY<0?1.15:1/1.15)},{passive:false});
const P=new Map();let d0=0;
wrap.addEventListener('pointerdown',e=>{if(e.target.closest('.btns'))return;P.set(e.pointerId,[e.clientX,e.clientY]);moved=false;if(P.size==2){const a=[...P.values()];d0=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);}});
window.addEventListener('pointermove',e=>{if(!P.has(e.pointerId))return;const o=P.get(e.pointerId),n=[e.clientX,e.clientY];
if(P.size==1){const dx=n[0]-o[0],dy=n[1]-o[1];if(Math.abs(dx)+Math.abs(dy)>0){if(Math.hypot(dx,dy)>1)moved=moved||Math.hypot(dx,dy)>3;tx+=dx;ty+=dy;apply();}P.set(e.pointerId,n);}
else{P.set(e.pointerId,n);const a=[...P.values()],d=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]),r=wrap.getBoundingClientRect();moved=true;if(d0)zoom((a[0][0]+a[1][0])/2-r.left,(a[0][1]+a[1][1])/2-r.top,d/d0);d0=d;}});
const up=e=>{P.delete(e.pointerId);d0=0;setTimeout(()=>moved=false,0)};
window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);
window.addEventListener('resize',fit);fit();
</script>
